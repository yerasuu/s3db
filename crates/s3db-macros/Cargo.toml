[package]
name = "s3db-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Derive macro for s3db: annotate a struct with #[entity(...)] to generate its Collection/SecondaryIndex boilerplate"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.6", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
