[package]
name = "s3db"
version = "0.4.2"
edition = "2024"
rust-version = "1.97"
description = "Typed, encrypted, CAS-consistent database over S3-compatible object storage"
license = "AGPL-3.0-or-later"

[features]
default = []
# put_stream/get_stream chunked upload/download -- only compiled in when a
# caller actually needs objects too big to buffer whole (git packs, LFS
# blobs). Off by default: this crate's own default profile assumes small,
# uniformly-sized objects (see json/payload's MAX_OBJECT_BYTES guard), and
# every driver's real chunking implementation is dead code, never exercised,
# under that profile -- less surface to audit. A caller that does need it
# just enables the feature.
streaming = []

[dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
s3db-crypto = { path = "../s3db-crypto" }
s3db-macros = { path = "../s3db-macros" }
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "sync",
    "macros",
    "rt-multi-thread",
    "time",
] }

# `default-features = false` to drop the `rustls` default feature: it maps to
# `aws-smithy-runtime/tls-rustls`, which is the *legacy* connector and drags in
# the whole rustls 0.21 / hyper 0.14 / h2 0.3 stack alongside the modern one --
# including rustls-webpki 0.101, which carries live name-constraint bypass
# advisories (RUSTSEC-2026-0098/0099) on the very connection that carries our
# credentials and every object body. `default-https-client` is the modern
# rustls 0.23 client and is all this crate actually uses; the other three are
# just the rest of the default set, kept as-is.
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-runtime-api = { version = "1.14.0", features = ["client"] }
azure_core = { version = "1.1.0", default-features = false, features = [
    "reqwest_rustls",
    "tokio",
] }
# azure_storage/azure_storage_blobs topped out at 0.21 (permanently pinned to azure_core
# ^0.21) — the account-key/HMAC generation. azure_core ^1.1 is a different, typespec-based
# generation that only ships auth via azure_identity (Entra ID/OAuth), hence the credential
# switch in AzureParams from account_key to tenant/client id/secret.
azure_storage_blob = { version = "1.1.0-beta.1", default-features = false, features = [
    "tokio",
] }
azure_identity = { version = "1.0.0", default-features = false }
google-cloud-auth = "1.15.0"
google-cloud-gax = "1.13.0"
google-cloud-storage = "1.17.0"

getrandom = "0.4.3"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
fs4 = { version = "1.1.0", features = ["tokio"] }
tempfile = "3.27.0"
rmp-serde = "1.3.1"
lru = "0.18.2"
redb = "4.1.0"
zeroize = { version = "1.9.0", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
# Only the config-file test needs a TOML parser: this crate takes `serde` and
# lets the application choose its own format.
toml = "0.9"
