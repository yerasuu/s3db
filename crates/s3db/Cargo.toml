[package]
name = "s3db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed, encrypted, CAS-consistent database over S3-compatible object storage"
license.workspace = true

[features]
default = []
# put_stream/get_stream chunked upload/download -- only compiled in when a
# caller actually needs objects too big to buffer whole (git packs, LFS
# blobs). Off by default: this crate's own default profile assumes small,
# uniformly-sized objects (see json/payload's MAX_OBJECT_BYTES guard), and
# every driver's real chunking implementation is dead code, never exercised,
# under that profile -- less surface to audit. A caller that does need it
# just enables the feature.
streaming = []
# Opt-in read-only JSON REST server (`rest::serve`) for browsing collections
# by hand -- off by default: a storage library has no business linking a
# web framework unless a caller actually asks for it. `tokio/net` is pulled
# in alongside axum since the base `tokio` dependency above has no need for
# `TcpListener` without this.
rest = ["dep:axum", "dep:rmpv", "tokio/net"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
# Solo para `rest::get_entry`: decodifica a `rmpv::Value` (que sí tiene un
# variante Binary/Ext) en vez de directo a `serde_json::Value`, así una
# entrada con bytes crudos (p.ej. un `Uuid`, que en MessagePack -- formato
# no-human-readable -- serializa como bytes, no como string) no hace fallar
# toda la lectura -- ver el comentario en `get_entry`.
rmpv = { version = "1.3.1", optional = true, features = ["with-serde"] }
futures = "0.3.34"
s3db-crypto = { path = "../s3db-crypto" }
s3db-macros = { path = "../s3db-macros" }
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "sync",
    "macros",
    "rt-multi-thread",
    "time",
] }

# `default-features = false` to drop the `rustls` default feature: it maps to
# `aws-smithy-runtime/tls-rustls`, which is the *legacy* connector and drags in
# the whole rustls 0.21 / hyper 0.14 / h2 0.3 stack alongside the modern one --
# including rustls-webpki 0.101, which carries live name-constraint bypass
# advisories (RUSTSEC-2026-0098/0099) on the very connection that carries our
# credentials and every object body. `default-https-client` is the modern
# rustls 0.23 client and is all this crate actually uses; the other three are
# just the rest of the default set, kept as-is.
aws-sdk-s3 = { version = "1.151.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }

getrandom = "0.4.3"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
fs4 = { version = "1.1.0", features = ["tokio"] }
tempfile = "3.27.0"
rmp-serde = "1.3.1"
lru = "0.18.5"
redb = "4.3.0"
tracing = "0.1.44"
zeroize = { version = "1.9.0", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
# Only the config-file test needs a TOML parser: this crate takes `serde` and
# lets the application choose its own format.
toml = "1.1"
# `rest`'s tests drive the router directly with `oneshot` instead of binding
# a real socket -- no need to race a port, no flakiness from one.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Solo para el test de `rest::get_entry` que reproduce a propósito lo que
# hace `Uuid` (y cualquier otro tipo con Serialize sensible a
# `is_human_readable`): serializa como bytes crudos en MessagePack.
serde_bytes = "0.11"
