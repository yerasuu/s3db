[package]
name = "s3db"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Typed, encrypted, CAS-consistent database over S3-compatible object storage"
license = "AGPL-3.0-or-later"

[features]
default = []
# put_stream/get_stream chunked upload/download -- only compiled in when a
# caller actually needs objects too big to buffer whole (git packs, LFS
# blobs). Off by default: this crate's own default profile assumes small,
# uniformly-sized objects (see json/payload's MAX_OBJECT_BYTES guard), and
# every driver's real chunking implementation is dead code, never exercised,
# under that profile -- less surface to audit. A caller that does need it
# (gitquarry's own git-hosting layer) just enables the feature.
streaming = []

[dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
s3db-macros = { path = "../s3db-macros" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "time"] }

aws-sdk-s3 = "1.140.0"
aws-smithy-runtime-api = { version = "1.14.0", features = ["client"] }
azure_core = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
azure_storage = { version = "0.21.0", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
azure_storage_blobs = { version = "0.21.0", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
google-cloud-auth = "1.15.0"
google-cloud-gax = "1.13.0"
google-cloud-storage = "1.17.0"

argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.0"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

anyhow = "1.0.104"
base64 = "0.23.0"
bytes = "1.12.1"
fs4 = { version = "1.1.0", features = ["tokio"] }
tempfile = "3.27.0"
rmp-serde = "1.3.1"
zstd = "0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
