[package]
name = "s3db-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure AEAD encryption primitive (XChaCha20Poly1305 + Argon2id + optional zstd) behind s3db's mandatory encryption-at-rest, usable standalone"
license.workspace = true

[dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
# The config-shaped types here (`CipherAlgorithm`, `EncryptionMode`,
# `CompressionStrategy`) are what a caller reads out of its own config file, so
# they carry serde derives -- the alternative is every caller hand-mapping three
# enums it did not define.
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
zeroize = "1.9.0"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
